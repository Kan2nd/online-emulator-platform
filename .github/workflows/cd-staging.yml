name: CD - staging

# Requires a GitHub Environment named "staging" with:
#   secret STAGING_KUBECONFIG   — base64-encoded kubeconfig for the staging cluster
#   variable STAGING_HEALTH_URL — e.g. https://staging.example.com

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  deploy-staging:
    # Off until a cluster exists: set the repository variable
    # K8S_DEPLOY_ENABLED=true (Settings -> Variables) to turn deploys on.
    if: github.event.workflow_run.conclusion == 'success' && vars.K8S_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig
        run: |
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.STAGING_KUBECONFIG }}" | base64 -d > "$HOME/.kube/config"

      - name: Apply base manifests (idempotent)
        run: kubectl apply -k deploy/k8s/overlays/staging

      - name: Roll out new image
        run: |
          kubectl -n staging set image deployment/session-manager \
            "session-manager=ghcr.io/${GITHUB_REPOSITORY,,}/session-manager:${{ github.event.workflow_run.head_sha }}"
          kubectl -n staging rollout status deployment/session-manager --timeout=120s

      - name: Smoke test
        run: curl -sf "${{ vars.STAGING_HEALTH_URL }}/health"
