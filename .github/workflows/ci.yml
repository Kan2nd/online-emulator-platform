name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_SESSION_MANAGER: ${{ github.repository }}/session-manager
  IMAGE_EMULATOR: ${{ github.repository }}/emulator

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install session-manager deps
        working-directory: session-manager
        run: npm install
      - name: Syntax check
        working-directory: session-manager
        run: |
          node --check src/index.js
          node --check src/dockerManager.js
          node --check src/storage.js
          node --check src/metrics.js
      # No automated test suite yet — add `npm test` here once one exists.

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push session-manager
        uses: docker/build-push-action@v6
        with:
          context: ./session-manager
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_SESSION_MANAGER }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_SESSION_MANAGER }}:latest

      - name: Build and push emulator image
        uses: docker/build-push-action@v6
        with:
          context: ./emulator-image
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_EMULATOR }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_EMULATOR }}:latest
