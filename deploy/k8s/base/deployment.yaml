apiVersion: apps/v1
kind: Deployment
metadata:
  name: session-manager
  labels:
    app: session-manager
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: session-manager
  template:
    metadata:
      labels:
        app: session-manager
    spec:
      containers:
        - name: session-manager
          image: ghcr.io/REPLACE_ME/session-manager:latest
          ports:
            - containerPort: 4000
          env:
            - name: EMULATOR_IMAGE
              value: ghcr.io/REPLACE_ME/emulator:latest
          livenessProbe:
            httpGet:
              path: /health
              port: 4000
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 4000
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
