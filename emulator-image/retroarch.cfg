# Renders into the Xvfb virtual display entrypoint.sh starts, which
# GStreamer captures and streams to the browser over WebRTC. Audio goes to
# SDL's dummy device (see entrypoint.sh): it's not streamed anywhere, it just
# gives RetroArch a real-time clock to pace emulation against.
video_driver = "sdl2"
audio_driver = "sdl2"
input_driver = "sdl2"
menu_driver = "null"
video_fullscreen = "true"
# Without a window manager on Xvfb, SDL2 can't negotiate fullscreen size
# from the desktop and silently creates a 1x1 window instead (confirmed via
# xwininfo) — force the resolution explicitly to match the Xvfb screen.
video_fullscreen_x = "480"
video_fullscreen_y = "320"

# There's no real display/compositor behind Xvfb's software framebuffer to
# deliver a vsync signal, which otherwise stalls RetroArch's render loop
# almost indefinitely (observed: ~2% CPU, no frames advancing).
video_vsync = "false"

# Save files go straight into savefile_directory (set per-session in
# entrypoint.sh) instead of per-core subfolders.
sort_savefiles_enable = "false"
sort_savestates_enable = "false"

# Periodic SRAM flush so a crashed/killed container doesn't lose progress
# between the save-on-clean-exit points.
autosave_interval = "30"

rewind_enable = "false"
savestate_auto_save = "false"
