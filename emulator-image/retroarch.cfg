# Renders into the Xvfb virtual display entrypoint.sh starts, which
# GStreamer captures and streams to the browser over WebRTC. Audio goes to
# SDL's dummy device (see entrypoint.sh): it's not streamed anywhere, it just
# gives RetroArch a real-time clock to pace emulation against.
video_driver = "sdl2"
audio_driver = "sdl2"
input_driver = "sdl2"
# RGUI is the lightweight software menu. It never opens on its own (the
# browser doesn't forward the menu hotkey), but it's what draws on-screen
# notifications such as "Saved state to slot #2".
menu_driver = "rgui"
audio_rate_control = "false"
video_fullscreen = "true"
# Without a window manager on Xvfb, SDL2 can't negotiate fullscreen size
# from the desktop and silently creates a 1x1 window instead (confirmed via
# xwininfo) — force the resolution explicitly to match the Xvfb screen.
video_fullscreen_x = "480"
video_fullscreen_y = "320"

# There's no real display/compositor behind Xvfb's software framebuffer to
# deliver a vsync signal, which otherwise stalls RetroArch's render loop
# almost indefinitely (observed: ~2% CPU, no frames advancing).
video_vsync = "false"

# Save files go straight into savefile_directory (set per-session in
# entrypoint.sh) instead of per-core subfolders.
sort_savefiles_enable = "false"
sort_savestates_enable = "false"

# Periodic SRAM flush so a crashed/killed container doesn't lose progress
# between the save-on-clean-exit points.
autosave_interval = "30"

rewind_enable = "false"
savestate_auto_save = "false"
savestate_thumbnail_enable = "false"
state_slot = "0"

# Save/load/reset/pause arrive as text commands on stdin, which
# entrypoint.sh wires to a FIFO that webrtc_server.py writes to. (The UDP
# network command port would collide between host-networked sessions.)
stdin_cmd_enable = "true"

# This file is the main config (passed with -c): never write it back, and
# switch off features that only log errors in a container.
config_save_on_exit = "false"
history_list_enable = "false"

# Debian's paths, normally inherited from its /etc/retroarch.cfg skeleton.
# Without the info path RetroArch can't read the core info files and
# refuses save states ("Core does not support save states").
libretro_info_path = "/usr/share/libretro/info/"
libretro_directory = "/usr/lib/x86_64-linux-gnu/libretro/"
assets_directory = "/usr/share/libretro/assets/"
cache_directory = "/tmp"
midi_driver = "null"
suspend_screensaver_enable = "false"
gamemode_enable = "false"
