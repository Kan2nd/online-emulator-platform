groups:
  - name: container-emulator
    rules:
      - alert: SessionManagerDown
        expr: up{job="session-manager"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "session-manager is unreachable"
          description: "Prometheus has not been able to scrape session-manager for 1 minute."

      - alert: HighSaveFlushErrorRate
        expr: increase(container_emulator_save_flush_errors_total[5m]) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "Save flush errors detected"
          description: "One or more sessions failed to stop cleanly in the last 5 minutes, risking lost save progress."

      - alert: SessionStartLatencyHigh
        expr: histogram_quantile(0.95, rate(container_emulator_session_start_duration_seconds_bucket[5m])) > 5
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Session start latency is high"
          description: "95th percentile container start time has exceeded 5s for 2 minutes."
