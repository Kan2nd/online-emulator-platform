<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Container Emulator</title>
<style>
  :root {
    --bg: #101216; --panel: #181b21; --panel-2: #20242c; --line: #2c313a;
    --text: #e8eaed; --muted: #9aa0a9; --accent: #6c8cff; --accent-2: #4f6fe0;
    --ok: #3ccf8e; --warn: #f2b84b; --danger: #ef5b5b; --radius: 10px;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  button { font: inherit; color: inherit; background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 7px 12px; cursor: pointer; }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:disabled { opacity: .4; cursor: not-allowed; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.primary:hover:not(:disabled) { background: var(--accent-2); }
  button.danger { border-color: #5a2a2a; color: #ffb3b3; }
  input { font: inherit; color: var(--text); background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; width: 180px; }
  input:focus { outline: none; border-color: var(--accent); }

  header { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 14px 24px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  header h1 { font-size: 17px; margin: 0; font-weight: 600; letter-spacing: .2px; }
  .player-field { display: flex; align-items: center; gap: 8px; color: var(--muted); }
  .field-error { color: var(--danger); font-size: 12px; min-height: 16px; }

  main { display: grid; grid-template-columns: 280px 1fr; gap: 20px; padding: 20px 24px; max-width: 1200px; margin: 0 auto; }
  @media (max-width: 820px) { main { grid-template-columns: 1fr; padding: 16px; } }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; }
  .panel h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .8px; color: var(--muted); margin: 0 0 12px; font-weight: 600; }

  .rom { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px; border-radius: 8px; border: 1px solid transparent; }
  .rom + .rom { margin-top: 6px; }
  .rom.active { border-color: var(--accent); background: var(--panel-2); }
  .rom-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tag { font-size: 11px; padding: 1px 6px; border-radius: 4px; background: #2b3550; color: #b8c6ff; margin-right: 8px; }
  .empty { color: var(--muted); font-size: 13px; }

  .screen { position: relative; background: #000; border-radius: 8px; overflow: hidden; aspect-ratio: 3 / 2; display: grid; place-items: center; }
  .screen video { width: 100%; height: 100%; object-fit: contain; image-rendering: pixelated; display: block; }
  .screen .overlay { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); text-align: center; padding: 20px; background: rgba(0,0,0,.55); }
  .screen:fullscreen { border-radius: 0; }

  .toolbar { display: flex; align-items: center; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  .toolbar .spacer { flex: 1; }
  .stats { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); margin-right: 6px; vertical-align: middle; }
  .dot.live { background: var(--ok); } .dot.wait { background: var(--warn); }
  .now-playing { font-weight: 600; }

  .slots { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 16px; }
  @media (max-width: 560px) { .slots { grid-template-columns: repeat(2, 1fr); } }
  .slot { background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 10px; }
  .slot-title { font-weight: 600; }
  .slot-time { font-size: 12px; color: var(--muted); margin: 2px 0 8px; min-height: 18px; }
  .slot-actions { display: flex; gap: 6px; }
  .slot-actions button { flex: 1; padding: 5px 0; }

  .keys { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 16px; color: var(--muted); font-size: 12px; }
  kbd { font: 11px/1 ui-monospace, monospace; background: var(--panel-2); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 5px; padding: 3px 6px; color: var(--text); }

  #toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(20px); background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 10px 16px; opacity: 0; transition: opacity .2s, transform .2s; pointer-events: none; }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  #toast.error { border-color: var(--danger); }
</style>
</head>
<body>
  <header>
    <h1>Container Emulator</h1>
    <div>
      <label class="player-field">Player <input id="userId" type="text" placeholder="your name" maxlength="32" autocomplete="off"></label>
      <div class="field-error" id="userError"></div>
    </div>
  </header>

  <main>
    <section class="panel">
      <h2>Library</h2>
      <div id="roms"><div class="empty">Loading…</div></div>
    </section>

    <section class="panel">
      <div class="screen" id="screen">
        <video id="gameVideo" autoplay muted playsinline></video>
        <div class="overlay" id="overlay">Pick a game from the library to start playing.</div>
      </div>

      <div class="toolbar">
        <span class="now-playing" id="nowPlaying">Nothing playing</span>
        <span class="stats"><span class="dot" id="liveDot"></span><span id="stats">offline</span></span>
        <span class="spacer"></span>
        <button id="pauseBtn" disabled>Pause</button>
        <button id="resetBtn" disabled>Reset</button>
        <button id="fullscreenBtn" disabled>Fullscreen</button>
        <button id="stopBtn" class="danger" disabled>Stop</button>
      </div>

      <h2 style="margin-top:20px">Save states</h2>
      <div class="slots" id="slots"></div>

      <div class="keys">
        <span><kbd>↑</kbd> <kbd>↓</kbd> <kbd>←</kbd> <kbd>→</kbd> D-pad</span>
        <span><kbd>X</kbd> A</span>
        <span><kbd>Z</kbd> B</span>
        <span><kbd>A</kbd> X</span>
        <span><kbd>S</kbd> Y</span>
        <span><kbd>Q</kbd> L</span>
        <span><kbd>W</kbd> R</span>
        <span><kbd>Enter</kbd> Start</span>
        <span><kbd>Shift</kbd> Select</span>
      </div>
    </section>
  </main>

  <div id="toast"></div>

  <script>
    const $ = (id) => document.getElementById(id);
    const userIdInput = $("userId");
    const gameVideo = $("gameVideo");
    const SLOT_COUNT = 4;
    const NAME_PATTERN = /^[A-Za-z0-9_-]{1,32}$/;
    const GAME_KEYS = new Set(["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", "Enter", "Shift", "z", "x", "a", "s", "q", "w"]);

    let session = null; // { id, game }
    let pc = null, ws = null, inputChannel = null, statsTimer = null, paused = false;

    userIdInput.value = localStorage.getItem("container-emulator-userId") || "";
    userIdInput.addEventListener("input", () => { $("userError").textContent = ""; });
    userIdInput.addEventListener("change", () => {
      localStorage.setItem("container-emulator-userId", userIdInput.value.trim());
    });

    let toastTimer = null;
    function toast(message, isError = false) {
      const el = $("toast");
      el.textContent = message;
      el.classList.toggle("error", isError);
      el.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => el.classList.remove("show"), 2600);
    }

    function setOverlay(text) {
      $("overlay").textContent = text || "";
      $("overlay").style.display = text ? "grid" : "none";
    }

    function setControls(enabled) {
      for (const id of ["pauseBtn", "resetBtn", "fullscreenBtn", "stopBtn"]) $(id).disabled = !enabled;
      renderSlots(null);
    }

    // ---------- library ----------
    async function loadRoms() {
      const res = await fetch("/roms");
      const { roms } = await res.json();
      const list = $("roms");
      list.innerHTML = "";
      if (!roms.length) {
        list.innerHTML = '<div class="empty">No ROMs yet. Add files to the server\'s roms/ folder.</div>';
        return;
      }
      for (const rom of roms) {
        const row = document.createElement("div");
        row.className = "rom";
        row.dataset.rom = rom;
        const name = document.createElement("span");
        name.className = "rom-name";
        const tag = document.createElement("span");
        tag.className = "tag";
        tag.textContent = rom.split(".").pop().toUpperCase();
        name.append(tag, document.createTextNode(rom.replace(/\.[^.]+$/, "")));
        name.title = rom;
        const btn = document.createElement("button");
        btn.className = "primary";
        btn.textContent = "Play";
        btn.addEventListener("click", () => startSession(rom));
        row.append(name, btn);
        list.appendChild(row);
      }
    }

    function markActiveRom() {
      for (const row of document.querySelectorAll(".rom")) {
        row.classList.toggle("active", !!session && row.dataset.rom === session.game);
        row.querySelector("button").disabled = !!session;
      }
    }

    // ---------- sessions ----------
    async function startSession(game) {
      const userId = userIdInput.value.trim();
      if (!NAME_PATTERN.test(userId)) {
        $("userError").textContent = "Enter a name: 1-32 letters, digits, - or _";
        userIdInput.focus();
        return;
      }
      localStorage.setItem("container-emulator-userId", userId);
      setOverlay("Starting " + game + "…");
      $("nowPlaying").textContent = game.replace(/\.[^.]+$/, "");
      $("liveDot").className = "dot wait";
      $("stats").textContent = "starting";
      document.querySelectorAll(".rom button").forEach((b) => (b.disabled = true));

      const res = await fetch("/sessions", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ userId, game }),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        setOverlay("Pick a game from the library to start playing.");
        $("nowPlaying").textContent = "Nothing playing";
        $("liveDot").className = "dot";
        $("stats").textContent = "offline";
        document.querySelectorAll(".rom button").forEach((b) => (b.disabled = false));
        toast(data.error || "Could not start the game.", true);
        return;
      }
      session = { id: data.sessionId, game };
      paused = false;
      $("pauseBtn").textContent = "Pause";
      markActiveRom();
      setControls(true);
      setOverlay("Connecting to stream…");
      connectStream(session.id);
      refreshSlots();
    }

    async function stopSession() {
      if (!session) return;
      const id = session.id;
      disconnectStream();
      session = null;
      markActiveRom();
      setControls(false);
      setOverlay("Pick a game from the library to start playing.");
      $("nowPlaying").textContent = "Nothing playing";
      await fetch(`/sessions/${id}`, { method: "DELETE" });
      toast("Session stopped. In-game saves were kept.");
    }

    // Close the container if the tab goes away, so sessions don't pile up.
    window.addEventListener("pagehide", () => {
      if (session) fetch(`/sessions/${session.id}`, { method: "DELETE", keepalive: true });
    });

    // ---------- stream ----------
    function connectStream(sessionId) {
      pc = new RTCPeerConnection({ iceServers: [] });
      ws = new WebSocket(`ws://${location.host}/stream/${sessionId}`);

      pc.ontrack = (e) => {
        // Render frames as soon as they decode — latency beats smoothness here.
        if ("jitterBufferTarget" in e.receiver) e.receiver.jitterBufferTarget = 0;
        if ("playoutDelayHint" in e.receiver) e.receiver.playoutDelayHint = 0;
        gameVideo.srcObject = e.streams[0] || new MediaStream([e.track]);
      };
      gameVideo.onplaying = () => setOverlay("");
      pc.ondatachannel = (e) => { inputChannel = e.channel; };
      pc.onicecandidate = (e) => {
        if (e.candidate && ws.readyState === WebSocket.OPEN) {
          ws.send(JSON.stringify({ type: "ice", candidate: e.candidate.candidate, sdpMLineIndex: e.candidate.sdpMLineIndex }));
        }
      };
      pc.onconnectionstatechange = () => {
        if (pc && pc.connectionState === "failed") {
          setOverlay("Stream connection failed. Stop and start the game again.");
        }
      };

      // Server ICE candidates can arrive before its offer is applied; hold them.
      let remoteReady = false;
      const pendingIce = [];
      let chain = Promise.resolve();
      ws.onmessage = (ev) => {
        const msg = JSON.parse(ev.data);
        chain = chain.then(async () => {
          if (msg.type === "offer") {
            await pc.setRemoteDescription({ type: "offer", sdp: msg.sdp });
            const answer = await pc.createAnswer();
            await pc.setLocalDescription(answer);
            ws.send(JSON.stringify({ type: "answer", sdp: answer.sdp }));
            remoteReady = true;
            for (const c of pendingIce.splice(0)) await pc.addIceCandidate(c);
          } else if (msg.type === "ice") {
            const cand = { candidate: msg.candidate, sdpMLineIndex: msg.sdpMLineIndex };
            if (remoteReady) await pc.addIceCandidate(cand);
            else pendingIce.push(cand);
          }
        }).catch((err) => toast("Stream error: " + err.message, true));
      };
      ws.onerror = () => setOverlay("Could not reach the game stream.");
      statsTimer = setInterval(updateStats, 2000);
    }

    function disconnectStream() {
      clearInterval(statsTimer);
      if (ws) ws.close();
      if (pc) pc.close();
      ws = pc = inputChannel = null;
      gameVideo.srcObject = null;
      $("liveDot").className = "dot";
      $("stats").textContent = "offline";
    }

    let lastFrames = null;
    async function updateStats() {
      if (!pc) return;
      let frames = null, rtt = null;
      (await pc.getStats()).forEach((r) => {
        if (r.type === "inbound-rtp" && r.kind === "video") frames = r.framesDecoded;
        if (r.type === "candidate-pair" && r.nominated && r.currentRoundTripTime != null) rtt = r.currentRoundTripTime;
      });
      if (frames == null) return;
      const fps = lastFrames == null ? 0 : Math.round((frames - lastFrames) / 2);
      lastFrames = frames;
      $("liveDot").className = "dot live";
      $("stats").textContent = `${fps} fps` + (rtt != null ? ` · ${Math.round(rtt * 1000)} ms` : "");
    }

    // ---------- input & commands ----------
    function sendToGame(obj) {
      if (!inputChannel || inputChannel.readyState !== "open") return false;
      inputChannel.send(JSON.stringify(obj));
      return true;
    }

    function onKey(event, type) {
      if (!session || event.target.tagName === "INPUT" || !GAME_KEYS.has(event.key)) return;
      event.preventDefault();
      if (type === "down" && event.repeat) return;
      sendToGame({ t: type, key: event.key });
    }
    window.addEventListener("keydown", (e) => onKey(e, "down"));
    window.addEventListener("keyup", (e) => onKey(e, "up"));

    function command(action, slot) {
      if (!sendToGame({ t: "cmd", action, slot })) {
        toast("Not connected to the game yet.", true);
        return false;
      }
      return true;
    }

    $("pauseBtn").addEventListener("click", () => {
      if (!command("pause")) return;
      paused = !paused;
      $("pauseBtn").textContent = paused ? "Resume" : "Pause";
    });
    $("resetBtn").addEventListener("click", () => {
      if (confirm("Reset the game? Progress since your last save will be lost.")) command("reset");
    });
    $("fullscreenBtn").addEventListener("click", () => {
      if (document.fullscreenElement) document.exitFullscreen();
      else $("screen").requestFullscreen();
    });
    $("stopBtn").addEventListener("click", stopSession);

    // ---------- save states ----------
    function timeAgo(iso) {
      const s = Math.round((Date.now() - new Date(iso).getTime()) / 1000);
      if (s < 60) return "just now";
      if (s < 3600) return `${Math.floor(s / 60)} min ago`;
      if (s < 86400) return `${Math.floor(s / 3600)} h ago`;
      return new Date(iso).toLocaleDateString();
    }

    function renderSlots(slots) {
      const wrap = $("slots");
      wrap.innerHTML = "";
      for (let i = 0; i < SLOT_COUNT; i++) {
        const info = slots ? slots[i] : null;
        const card = document.createElement("div");
        card.className = "slot";
        const title = document.createElement("div");
        title.className = "slot-title";
        title.textContent = `Slot ${i + 1}`;
        const time = document.createElement("div");
        time.className = "slot-time";
        time.textContent = !session ? "—" : info && info.savedAt ? "Saved " + timeAgo(info.savedAt) : "Empty";
        const actions = document.createElement("div");
        actions.className = "slot-actions";
        const save = document.createElement("button");
        save.textContent = "Save";
        save.disabled = !session;
        save.addEventListener("click", () => saveState(i, info && info.savedAt));
        const load = document.createElement("button");
        load.textContent = "Load";
        load.disabled = !session || !(info && info.savedAt);
        load.addEventListener("click", () => loadState(i));
        actions.append(save, load);
        card.append(title, time, actions);
        wrap.appendChild(card);
      }
    }

    async function fetchSlots() {
      if (!session) return null;
      const res = await fetch(`/sessions/${session.id}/states`);
      return res.ok ? (await res.json()).slots : null;
    }

    async function refreshSlots() {
      renderSlots(await fetchSlots());
    }

    async function saveState(slot, previous) {
      if (!command("save", slot)) return;
      toast(`Saving to slot ${slot + 1}…`);
      // The state file is written a few frames later; poll until it changes.
      for (let i = 0; i < 12; i++) {
        await new Promise((r) => setTimeout(r, 400));
        const slots = await fetchSlots();
        if (slots && slots[slot].savedAt && slots[slot].savedAt !== previous) {
          renderSlots(slots);
          toast(`Saved to slot ${slot + 1}`);
          return;
        }
      }
      toast(`Couldn't confirm the save to slot ${slot + 1}.`, true);
      refreshSlots();
    }

    function loadState(slot) {
      if (command("load", slot)) toast(`Loaded slot ${slot + 1}`);
    }

    setInterval(() => { if (session) refreshSlots(); }, 30000);
    renderSlots(null);
    loadRoms();
  </script>
</body>
</html>
